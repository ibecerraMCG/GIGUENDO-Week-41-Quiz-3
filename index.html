<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 41 Practice Quiz 3</title>

    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            
            /* Default Feedback Colors (Fallback for custom themes) */
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }[data-theme="dark"] {
            --bg-body: #1e293b; --bg-card: #334155; --bg-header: #0f172a;
            --text-main: #f1f5f9; --text-muted: #94a3b8; --text-accent: #38bdf8;
            --border-color: #475569; --highlight-bg: #475569;
            --button-bg: #38bdf8; --button-text: #0f172a; --button-hover: #0ea5e9;
        }[data-theme="light"] {
            --bg-body: #f3f4f6; --bg-card: #ffffff; --bg-header: #ffffff;
            --text-main: #1f2937; --text-muted: #6b7280; --text-accent: #2563eb;
            --border-color: #e5e7eb; --highlight-bg: #f3f4f6;
            --button-bg: #2563eb; --button-text: #ffffff; --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5; --feedback-success-border: #34d399; --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2; --feedback-error-border: #f87171; --feedback-error-text: #991b1b;
        }[data-theme="midnight"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #e0e0e0; --text-muted: #888888; --text-accent: #90caf9;
            --border-color: #333333; --highlight-bg: #1a1a1a;
            --button-bg: #90caf9; --button-text: #000000; --button-hover: #42a5f5;
            --feedback-success-bg: #051b11; --feedback-success-border: #0f5132; --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e; --feedback-error-border: #842029; --feedback-error-text: #ea868f;
        }[data-theme="legacy-dark"] {
            --bg-body: #2d343e; --bg-card: #3c424f; --bg-header: #3c424f;
            --text-main: #e8e6e3; --text-muted: #b0c4de; --text-accent: #8ab4f8;
            --border-color: #555; --highlight-bg: #454c5a;
            --button-bg: #8ab4f8; --button-text: #202124; --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41; --feedback-success-border: #52b788; --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129; --feedback-error-border: #a4133c; --feedback-error-text: #f8d7da;
        }[data-theme="sepia"] {
            --bg-body: #f4ecd8; --bg-card: #fdf6e3; --bg-header: #e4d5b7;
            --text-main: #433422; --text-muted: #7c6f5a; --text-accent: #a05a2c;
            --border-color: #d3c4a5; --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c; --button-text: #fdf6e3; --button-hover: #864822;
            --feedback-success-bg: #e6f4ea; --feedback-success-border: #8ab893; --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3; --feedback-error-border: #d48f8f; --feedback-error-text: #5c2b2b;
        }

        [data-theme="contrast"] {
            --bg-body: #000000; --bg-card: #000000; --bg-header: #000000;
            --text-main: #ffffff; --text-muted: #dddddd; --text-accent: #ffff00;
            --border-color: #ffffff; --highlight-bg: #333333;
            --button-bg: #ffff00; --button-text: #000000; --button-hover: #e6e600;
            --feedback-success-bg: #000000; --feedback-success-border: #00ff00; --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000; --feedback-error-border: #ff0000; --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        header.unpinned { position: relative; box-shadow: none; }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; flex-wrap: wrap; gap: 15px;
        }

        header h1 { font-size: 1.5rem; margin: 0; color: var(--text-accent); font-weight: 700; }

        .controls-wrapper { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* --- Custom Theme Builder --- */
        .custom-builder {
            display: none; flex-wrap: wrap; gap: 15px;
            background-color: var(--bg-card); padding: 10px 15px;
            border-radius: 8px; border: 1px solid var(--border-color);
            margin-top: 5px; font-size: 0.85rem; animation: fadeIn 0.3s;
            width: 100%; justify-content: flex-end;
        }
        .custom-builder.active { display: flex; }
        .color-picker-group { display: flex; align-items: center; gap: 8px; }
        .color-picker-group input[type="color"] {
            border: none; width: 25px; height: 25px; border-radius: 4px;
            cursor: pointer; padding: 0; background: none;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Controls --- */
        .header-btn {
            background-color: var(--highlight-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .header-btn:hover {
            border-color: var(--text-accent);
            color: var(--text-accent);
        }

        .pin-btn {
            background: none; border: 1px solid var(--border-color); color: var(--text-main);
            cursor: pointer; padding: 0 10px; border-radius: 6px; font-size: 1rem;
            transition: background-color 0.2s; height: 34px; display: flex;
            align-items: center; justify-content: center;
        }
        .pin-btn:hover { background-color: var(--highlight-bg); }
        .pin-btn.pin-active { background-color: rgba(0, 0, 0, 0.1); }

        select#theme-select {
            padding: 0 12px; border-radius: 6px; border: 1px solid var(--border-color);
            background-color: var(--bg-card); color: var(--text-main);
            cursor: pointer; font-family: inherit; height: 34px;
        }

        /* --- Section Navigation --- */
        .section-nav { display: flex; gap: 10px; flex-wrap: wrap; }
        .section-nav button {
            background-color: var(--highlight-bg); color: var(--text-main);
            border: 1px solid var(--border-color); padding: 6px 12px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem;
            font-weight: 500; transition: all 0.2s;
        }
        .section-nav button:hover { border-color: var(--text-accent); color: var(--text-accent); }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
            scroll-margin-top: 150px; /* Offset for sticky header */
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
            display: none; /* Hidden by default */
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        .btn-link {
            display: inline-block;
            background-color: var(--button-bg);
            color: var(--button-text);
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-link:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: flex-start; }
            .section-nav { justify-content: flex-start; }
            .custom-builder { justify-content: flex-start; }
            header h1 { font-size: 1.25rem; }
            #reveal-all-container { justify-content: flex-start !important; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <div class="header-top">
            <h1>Week 41 Practice Quiz 3</h1>
            <div class="controls-wrapper">
                
                <!-- Reveal LOs Button -->
                <button id="reveal-all-btn" class="header-btn" onclick="toggleAllLOs()">Show Learning Objectives</button>
                
                <!-- Pin Button -->
                <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">📌</button>
                
                <!-- Theme Selector -->
                <div class="theme-control">
                    <select id="theme-select" onchange="changeTheme(this.value)">
                        <option value="dark">Modern Dark</option>
                        <option value="midnight">Midnight</option>
                        <option value="light">Modern Light</option>
                        <option value="legacy-dark">Legacy Dark</option>
                        <option value="sepia">Sepia</option>
                        <option value="contrast">High Contrast</option>
                        <option value="custom">⚙️ Custom...</option>
                    </select>
                </div>
            </div>
            
            <!-- Custom Theme Color Pickers -->
            <div class="custom-builder" id="custom-builder">
                <div class="color-picker-group">
                    <label>Background:</label>
                    <input type="color" id="color-bg" value="#1a1a2e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Cards:</label>
                    <input type="color" id="color-card" value="#16213e" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Text:</label>
                    <input type="color" id="color-text" value="#e94560" oninput="updateCustomTheme()">
                </div>
                <div class="color-picker-group">
                    <label>Accent:</label>
                    <input type="color" id="color-accent" value="#0f3460" oninput="updateCustomTheme()">
                </div>
            </div>
        </div>
        
        <!-- Dynamic Navigation Bar -->
        <div class="section-nav" id="section-nav"></div>
    </header>

    <div class="container">
        <div id="quiz-root">
            <!-- Content injected via JS -->
        </div>
    </div>

    <script>
        // --- Data ---
        const quizData =[
            // --- Section 1: Fluid and Electrolyte Clinical Correlations ---
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO1: Describe the mechanisms that may lead to hyponatremia and hypernatremia.",
                question: "A 58-year-old man with a history of severe congestive heart failure is admitted to the hospital with worsening edema, ascites, and dyspnea. Routine laboratory testing reveals a serum sodium concentration of 128 mEq/L (hyponatremia). Which of the following is the fundamental underlying mechanism driving the development of hypoosmolality and hyponatremia in this patient?",
                options: {
                    A: "An absolute deficiency of total body sodium",
                    B: "An excess of water in relation to solute",
                    C: "Extensive third spacing of fluids into the peritoneal cavity",
                    D: "Primary failure of the hypothalamic osmoreceptors",
                    E: "Severe, uncompensated gastrointestinal fluid loss"
                },
                correctAnswer: "B",
                rationale: "Hyponatremia usually reflects hypo-osmolality. The common denominator in almost all hypoosmolal states (including hypervolemic states like congestive heart failure) is water retention leading to an excess of water in relation to solute.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 3: 'Water retention leading to an excess of water in relation to solute is the Common denominator in almost all hypoosmolal states.'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO1: Describe the mechanisms that may lead to hyponatremia and hypernatremia.",
                question: "A 75-year-old woman is brought to the emergency department from a nursing home. She has advanced dementia and is bedbound. Laboratory studies reveal a serum sodium concentration of 158 mEq/L. The patient has had no access to free water for two days. According to physiological principles, hypernatremia can be generated by sodium retention or which of the following?",
                options: {
                    A: "Excessive secretion of antidiuretic hormone",
                    B: "Excessive urinary loss of sodium",
                    C: "Massive intracellular shifts of sodium",
                    D: "Pure water loss (deficit)",
                    E: "Shift of water into the extracellular space"
                },
                correctAnswer: "D",
                rationale: "Hypernatremia represents a hyperosmolal state that can be generated fundamentally from either water loss (water deficit) or Na+ retention. In an elderly patient with poor water access due to debility, inadequate intake leads to a pure water deficit.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slides 19 & 20: 'Generation of Hypernatremia • Hypernatremia Can be generated from water loss or Na+ retention.' and 'Causes of hypernatremia... Pure Water deficit • Inadequate intake (e.g., Poor water access due to debility...)'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO2: Discuss the evaluation of hyponatremia and hypernatremia.",
                question: "A 45-year-old woman is found to have a serum sodium of 125 mEq/L on a routine metabolic panel (low). The physician begins a systematic diagnostic evaluation to determine the etiology. According to standard evaluation algorithms, which of the following is the most appropriate first step in evaluating this patient's hyponatremia?",
                options: {
                    A: "Assess urine sodium concentration",
                    B: "Check serum thyroid-stimulating hormone (TSH)",
                    C: "Determine the patient's volume status (ECF status)",
                    D: "Measure plasma osmolality",
                    E: "Obtain a CT scan of the head"
                },
                correctAnswer: "D",
                rationale: "The first step in the evaluation of hyponatremia is to measure plasma osmolality (normal 275-290 mOsm/kg) to differentiate between hypertonic, isotonic, and hypotonic hyponatremia, as true hyponatremic patients are hypotonic.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 12: 'Evaluation of Hyponatremia Step 1: Plasma Osmolality (275 mOsm to 290 mOsm/kg) • Differentiate between hypertonic, isotonic, and hypotonic hyponatremia. • True hyponatremic patients are hypotonic.'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO2: Discuss the evaluation of hyponatremia and hypernatremia.",
                question: "A 60-year-old man presents with severe hypernatremia. To systematically evaluate the cause of his condition, the physician assesses his extracellular fluid volume (ECFV) and finds it to be visibly decreased (hypovolemic). Which of the following is the next most appropriate parameter to measure to differentiate between renal and extrarenal causes of his hypotonic fluid deficit?",
                options: {
                    A: "Plasma osmolality",
                    B: "Serum glucose",
                    C: "Serum potassium",
                    D: "Urine sodium and urine osmolality",
                    E: "Urine specific gravity"
                },
                correctAnswer: "D",
                rationale: "According to the diagnostic algorithm for hypernatremia, if a patient has decreased ECFV (hypotonic fluid deficit), the clinician should next evaluate urine sodium and urine osmolality to differentiate between a renal hypotonic fluid loss (e.g., diuretics, where urine Na > 20 mEq/L) and an extrarenal loss (e.g., skin, GI, where urine Na < 10 mEq/L).",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 27: 'Hypernatremia - Diagnosis [Flowchart] -> Decreased ECFV -> Hypotonic fluid deficit -> Urine sodium [and] Urine osmolality ->[Branches to] Renal hypotonic fluid loss OR Extrarenal hypotonic fluid loss'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO3: Describe the use of plasma sodium, plasma osmolality, urine sodium, and urine osmolality in hyponatremia and hypernatremia.",
                question: "A 30-year-old man with schizophrenia presents to the emergency department after drinking over 15 liters of water in the past 24 hours. His serum sodium is 118 mEq/L. Plasma osmolality confirms a true hypotonic state. Which of the following urine osmolality findings would most strongly indicate primary polydipsia in this patient?",
                options: {
                    A: "Less than 100 mOsm/kg",
                    B: "Between 200 and 300 mOsm/kg",
                    C: "Exactly 300 mOsm/kg",
                    D: "Greater than 400 mOsm/kg",
                    E: "Greater than 700 mOsm/kg"
                },
                correctAnswer: "A",
                rationale: "In step 2 of hyponatremia evaluation, a urine osmolality less than 100 mOsm/kg indicates appropriate suppression of ADH in the face of massive water intake, pointing to primary polydipsia or a reset osmostat.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 12: 'Step 2: Urine Osmolality • Urine osmolality less than 100 mOsm/kg indicates primary polydipsia or reset osmostat.'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO3: Describe the use of plasma sodium, plasma osmolality, urine sodium, and urine osmolality in hyponatremia and hypernatremia.",
                question: "A 50-year-old woman is evaluated for hypovolemic hyponatremia. The physician measures her urine sodium concentration to distinguish the source of her fluid loss. Her urine sodium is reported as 5 mmol/L. This value strongly points to which of the following mechanisms?",
                options: {
                    A: "Active diuretic use",
                    B: "Cortisol deficiency",
                    C: "Extrarenal loss of fluid (e.g., remote vomiting)",
                    D: "Renal salt-wasting nephropathy",
                    E: "Syndrome of inappropriate antidiuretic hormone (SIADH)"
                },
                correctAnswer: "C",
                rationale: "In step 4 of hyponatremia evaluation, a urine sodium less than 10 mmol/L indicates an extrarenal loss of fluid (such as remote vomiting or diarrhea), because the intact kidneys are appropriately holding onto sodium to restore volume. A urine sodium >20 mmol/L would suggest a renal loss (e.g., diuretics, salt wasting).",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 13: 'Step 4: Urine Sodium Concentration • Urine sodium less than 10 mmol/L indicates extrarenal loss of fluid (remote diuretic use and remote vomiting).'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO4: Identify common causes of hyponatremia and hypernatremia.",
                question: "A 65-year-old man is started on a new medication for hypertension. Two weeks later, routine laboratory testing reveals a serum sodium level of 126 mEq/L. Which of the following classes of diuretics represents virtually the only clinical setting in which hyponatremia is produced by the loss of effective solute (Na+ and K+) in excess of water?",
                options: {
                    A: "Carbonic anhydrase inhibitors",
                    B: "Loop diuretics",
                    C: "Osmotic diuretics",
                    D: "Potassium-sparing diuretics",
                    E: "Thiazide diuretics"
                },
                correctAnswer: "E",
                rationale: "Almost all cases of diuretic-induced hyponatremia are due to thiazide diuretics, not loop diuretics. Thiazides act in the cortex and do not interfere with urinary concentration or ADH's ability to promote water retention, causing loss of Na/K in excess of water.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 10: 'Almost all cases of diuretic-induced hyponatremia are due to thiazide, not loop diuretics ... Use of thiazide diuretics represents virtually the only clinical setting in which hyponatremia can be produced in part by the loss of effective solute (Na+ & K+) in excess of water.'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO4: Identify common causes of hyponatremia and hypernatremia.",
                question: "A 40-year-old patient with bipolar disorder develops severe polyuria and hypernatremia. The physician diagnoses nephrogenic diabetes insipidus secondary to long-term lithium therapy. The molecular mechanism of this specific drug-induced urinary concentration defect involves the dysregulation of which of the following systems in the principal cells of the collecting duct?",
                options: {
                    A: "Aquaporin system",
                    B: "Calcium-sensing receptor",
                    C: "Epithelial sodium channels (ENaC)",
                    D: "Na+/K+/2Cl- cotransporter",
                    E: "V1 vascular receptors"
                },
                correctAnswer: "A",
                rationale: "Lithium-induced nephrogenic diabetes insipidus (NDI) promotes polyuria by counteracting intracellular vasopressin signaling, leading to dysregulation of the aquaporin system (specifically Aquaporin-2) in the principal cells of the collecting duct.",
                source: "Fluid and Electrolyte Clinical Correlations PDF, slide 24: 'Li+-induced NDI... The molecular mechanisms of Li+-related urinary concentration defect involves dysregulation of the aquaporin system in principal cells of the collecting duct.'"
            },
            {
                section: "Fluid and Electrolyte Clinical Correlations",
                fullLO: "LO5: Discuss clinical manifestations of hyponatremia and hypernatremia.",
                question: "A 70-year-old man is brought to the emergency department from a long-term care facility with severe dehydration. His serum sodium is 165 mEq/L. Because hypernatremia causes cellular dehydration in the brain, the clinical manifestations are primarily neurologic. Which of the following sets of symptoms represents the early signs of hypernatremia?",
                options: {
                    A: "Coma and death",
                    B: "Deep venous thrombosis and pulmonary embolism",
                    C: "Lethargy, weakness, and irritability",
                    D: "Muscle spasticity and focal neurologic deficits",
                    E: "Twitching and seizures"
                },

                    A: "Calcium oxalate",
                    B: "Calcium phosphate",
                    C: "Cystine",
                    D: "Magnesium ammonium phosphate",
                    E: "Uric acid"
                },
                correctAnswer: "D",
                rationale: "Staghorn calculi are massive, branched stones that fill the renal pelvis. They are usually composed of magnesium ammonium phosphate (\"triple phosphate\" stones) and are classically associated with alkaline urine caused by recurrent UTIs with urea-splitting organisms like Proteus vulgaris.",
                source: "Non-Glomerular Disease of the Kidney PDF, slide 52: 'URINARY OUTFLOW TRACT OBSTRUCTION DUE TO STONES ... 15% magnesium, ammonium, and calcium phosphates “triple phosphate stones” associated with UTI by urea splitting organisms Proteus vulgaris ... leading to large branched stone referred to as a staghorn calculus and usually composed of magnesium ammonium phosphate'"
            },
            {
                section: "Non-Glomerular Disease of the Kidney",
                fullLO: "LO4: Compare and contrast the various types of renal stones.",
                question: "A 45-year-old man presents to the emergency department with acute, excruciating, colicky flank pain radiating to his groin. A non-contrast CT scan demonstrates a small 4-mm stone in the right ureter. Based on the epidemiology of urolithiasis, this patient's stone is most likely composed of which of the following?",
                options: {
                    A: "Calcium oxalate and/or calcium phosphate",
                    B: "Cystine",
                    C: "Magnesium ammonium phosphate",
                    D: "Pure struvite",
                    E: "Uric acid"
                },
                correctAnswer: "A",
                rationale: "Calcium-based stones (calcium oxalate and/or calcium phosphate) are by far the most common type of renal stones, accounting for 80% of all urolithiasis cases. They are typically small and unilateral.",
                source: "Non-Glomerular Disease of the Kidney PDF, slide 52: 'Renal stones (Urolithiasis) • 80% calcium oxalate and/or calcium phosphate' AND 'Morphology • Unilateral small stones in 80% of patients'"
            }
        ];

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');
        const sectionNav = document.getElementById('section-nav');
        const customBuilder = document.getElementById('custom-builder');
        const rootElements = document.documentElement;

        let isRevealed = false;

        function toggleAllLOs() {
            isRevealed = !isRevealed;
            const btn = document.getElementById('reveal-all-btn');
            btn.textContent = isRevealed ? "Hide Learning Objectives" : "Show Learning Objectives";
            
            document.querySelectorAll('.lo-box').forEach(box => {
                box.style.display = isRevealed ? 'block' : 'none';
            });
        }

        function initQuiz() {
            let currentSection = "";
            let sectionIndex = 0;
            
            quizData.forEach((item, index) => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    
                    const sectionId = 'sec-' + sectionIndex;
                    
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.id = sectionId;
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);

                    const navBtn = document.createElement('button');
                    let btnText = currentSection;
                    if (btnText.includes("Fluid and Electrolyte Clinical Correlations")) btnText = "Fluid & Electrolyte";
                    if (btnText.includes("Sepsis")) btnText = "Sepsis";
                    if (btnText.includes("Bladder Dysfunction")) btnText = "Bladder Dysfunction";
                    if (btnText.includes("Non-Glomerular Disease of the Kidney")) btnText = "Non-Glomerular Disease";
                    
                    navBtn.textContent = btnText;
                    navBtn.onclick = () => {
                        document.getElementById(sectionId).scrollIntoView({ behavior: 'smooth' });
                    };
                    sectionNav.appendChild(navBtn);

                    sectionIndex++;
                }

                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.innerHTML = item.fullLO;
                card.appendChild(loBox);

                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.innerHTML = `${index + 1}. ${item.question}`;
                card.appendChild(qText);

                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const[key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.innerHTML = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            const returnContainer = document.createElement('div');
            returnContainer.style.textAlign = 'center';
            returnContainer.style.marginTop = '2rem';
            
            const returnBtn = document.createElement('a');
            returnBtn.href = 'https://ibecerramcg.github.io/GI-GU-ENDO-Practice-Quizzes/';
            returnBtn.className = 'btn-link';
            returnBtn.textContent = '← Return to Quiz Directory';
            
            returnContainer.appendChild(returnBtn);
            quizRoot.appendChild(returnContainer);

            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            themeSelect.value = savedTheme;
            changeTheme(savedTheme);

            const savedPinState = localStorage.getItem('headerPinned');
            toggleHeader(savedPinState !== 'false');
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            localStorage.setItem('quizTheme', themeName);
            
            if (themeName === 'custom') {
                rootElements.removeAttribute('data-theme');
                customBuilder.classList.add('active');
                loadCustomTheme();
            } else {
                rootElements.setAttribute('data-theme', themeName);
                customBuilder.classList.remove('active');
                rootElements.removeAttribute('style');
            }
        }

        function updateCustomTheme() {
            const bg = document.getElementById('color-bg').value;
            const card = document.getElementById('color-card').value;
            const text = document.getElementById('color-text').value;
            const accent = document.getElementById('color-accent').value;

            rootElements.style.setProperty('--bg-body', bg);
            rootElements.style.setProperty('--bg-header', bg);
            rootElements.style.setProperty('--bg-card', card);
            rootElements.style.setProperty('--highlight-bg', card);
            rootElements.style.setProperty('--text-main', text);
            rootElements.style.setProperty('--text-accent', accent);
            rootElements.style.setProperty('--button-bg', accent);
            rootElements.style.setProperty('--button-text', bg);
            rootElements.style.setProperty('--border-color', accent + '40');

            const customColors = { bg, card, text, accent };
            localStorage.setItem('customThemeColors', JSON.stringify(customColors));
        }

        function loadCustomTheme() {
            const savedColors = JSON.parse(localStorage.getItem('customThemeColors'));
            if (savedColors) {
                document.getElementById('color-bg').value = savedColors.bg;
                document.getElementById('color-card').value = savedColors.card;
                document.getElementById('color-text').value = savedColors.text;
                document.getElementById('color-accent').value = savedColors.accent;
                updateCustomTheme();
            } else {
                updateCustomTheme();
            }
        }

        function toggleHeader(forceState) {
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
</body>
</html>
